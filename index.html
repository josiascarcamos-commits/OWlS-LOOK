<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OWLS LOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f5f0;
      color: #3a2e2b;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* Logo Wrapper */
    .logo-container {
      background-color: #ffffff;
      padding: 3rem 2rem;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(181, 148, 96, 0.2);
    }

    /* Sparkles Decorative Element */
    .sparkle {
      position: absolute;
      color: #3a2e2b;
    }

    .sparkle-top-right {
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
    }

    .sparkle-bottom-left {
      bottom: 15px;
      left: 20px;
      font-size: 1.8rem;
    }

    /* Logo Brand Typography & Owl Icon */
    .brand-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .brand-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #3a2e2b;
      text-transform: uppercase;
    }

    /* SVG Owl Icon mimicking the original design */
    .owl-icon {
      width: 65px;
      height: auto;
      fill: none;
      stroke: #b59460;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Slogan */
    .slogan {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.8rem;
      color: #5c4a43;
      margin-top: 1rem;
    }

    /* Button linking to Instagram */
    .ig-button {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      padding: 0.8rem 1.8rem;
      background-color: #3a2e2b;
      color: #f7f5f0;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(58, 46, 43, 0.15);
    }

    .ig-button:hover {
      background-color: #b59460;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(181, 148, 96, 0.3);
    }

    .ig-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .brand-text {
        font-size: 2rem;
        letter-spacing: 0.15em;
      }
      .owl-icon {
        width: 50px;
      }
      .slogan {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-container">
      <!-- Sparkles -->
      <span class="sparkle sparkle-top-right">✦</span>
      <span class="sparkle sparkle-bottom-left">✦</span>

      <!-- Brand & Owl Graphic -->
      <div class="brand-box">
        <span class="brand-text">OWLS</span>
        
        <!-- Minimalist Owl Vector -->
        <svg class="owl-icon" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer Body Contour -->
          <path d="M 30,20 C 15,35 10,70 30,105 C 45,115 55,115 70,105 C 90,70 85,35 70,20 C 60,10 40,10 30,20 Z" />
          <!-- Head / Ears Crescent -->
          <path d="M 30,20 C 40,32 60,32 70,20" />
          <!-- Left Eye -->
          <circle cx="38" cy="42" r="10" />
          <polygon points="38,38 40,42 38,46 36,42" fill="#b59460" />
          <!-- Right Eye -->
          <circle cx="62" cy="42" r="10" />
          <polygon points="62,38 64,42 62,46 60,42" fill="#b59460" />
          <!-- Beak -->
          <polygon points="50,48 45,56 55,56" fill="#b59460" />
          <!-- Wing Lines -->
          <path d="M 22,55 C 18,75 32,95 48,102" />
          <path d="M 78,55 C 82,75 68,95 52,102" />
        </svg>

        <span class="brand-text">LOOK</span>
      </div>

      <!-- Slogan -->
      <p class="slogan">Mira, expresa y vístete</p>
    </div>

    <!-- Instagram Link Button -->
    <a href="https://www.instagram.com/p/DeVN7NKKifX/?cplk=MTlpY24wZHh2dm1obg==" target="_blank" rel="noopener noreferrer" class="ig-button">
      <svg class="ig-icon" viewBox="0 0 24 24">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      Ver en Instagram
    </a>
  </div>

</body>
</html>
